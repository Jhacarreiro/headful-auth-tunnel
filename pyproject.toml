[project]
name = "headful-auth-tunnel"
version = "0.2.0"
description = "LAN/VPN remote-control tunnel for human-operated headful Scrapling browser sessions with persistent profiles."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "João Carreiro" }]
keywords = ["scrapling", "headful", "browser", "persistent-profile", "remote-control", "auth-tunnel"]
dependencies = ["scrapling"]

[project.urls]
Homepage = "https://github.com/Jhacarreiro/headful-auth-tunnel"
Repository = "https://github.com/Jhacarreiro/headful-auth-tunnel"

[project.scripts]
headful-auth-tunnel = "headful_auth_tunnel.server:main"
